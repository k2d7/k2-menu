name: Duroob Windows build

on:
  push:
    paths:
      - "duroob/**"
      - ".github/workflows/duroob-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyInstaller
        run: python -m pip install pyinstaller==6.11.1
      - name: Build Duroob.exe
        working-directory: duroob
        run: pyinstaller --noconfirm --onefile --windowed --name Duroob --icon icon.ico --add-data "web;web" server.py
      - name: Smoke test
        working-directory: duroob
        shell: pwsh
        run: |
          $env:DUROOB_PORT = "8790"
          $p = Start-Process -FilePath "dist\Duroob.exe" -ArgumentList "--no-window" -PassThru
          Start-Sleep -Seconds 8
          $r = Invoke-RestMethod -Uri "http://127.0.0.1:8790/api/ping"
          Stop-Process -Id $p.Id -Force
          if ($r.app -ne "duroob") { throw "Duroob did not start" }
      - uses: actions/upload-artifact@v4
        with:
          name: Duroob-Windows
          path: duroob/dist/Duroob.exe
          retention-days: 90
